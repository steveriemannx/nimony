
--path: "$nim"
--define: nimcore
# Btw this relies on a Nim bug where it interprets the --outdir relative to the current directory
# instead of the directory of this nim.cfg file.
--outdir: "bin"

# The checked-out parser (see `config.nims`) sits outside `$nim/compiler`, so its
# unqualified `import llstream, lexer, idents, ...` no longer resolves next to
# itself. Put the host compiler's module directory on the search path so those
# siblings are found -- everything else nifler imports is either `std/`-prefixed
# or an explicit relative path, and no bare name in its module graph collides
# with a file in there.
--path: "$nim/compiler"

# ... and the location distributions use. FreeBSD's port installs the compiler
# sources under `<nim>/lib/compiler`, so the line above resolves to nothing
# there and nifler fails with "cannot open file: llstream". Both spellings are
# listed; a path that does not exist is simply skipped.
#
# This belongs here and not on the nim command line: a config-file `--path` is
# searched BEFORE the stdlib, a command-line one AFTER it. Passed on the command
# line, `import options` inside Nim's `parser.nim` resolves to `std/options` and
# nifler dies on `undeclared identifier: 'ConfigRef'`.
#
# It also settles the StdPrefix warning that `src/config.nims` promotes to an
# error: `belongsToStdlib` is keyed on the package, not on the path, so once the
# module resolves to the compiler package the warning never fires.
--path: "$nim/lib/compiler"
